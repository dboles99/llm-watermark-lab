services:
  tee-test-server:
    build:
      context: ../..
      dockerfile: deploy/local-tee/Dockerfile
    environment:
      WATERMARK_LAB_TEE_DEPLOYMENT_MODE: local-development
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
