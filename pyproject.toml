[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-watermark-lab"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "Daniel Boles" }]
description = "Research lab for measuring and detecting statistical watermarks in LLM text"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "polars[rtcompat]>=1.5",
  "pyarrow>=17.0",
  "transformers>=4.44",
  "tokenizers>=0.20",
  "httpx>=0.27",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "openai>=1.100",
  "azure-identity>=1.24",
  "pyside6>=6.7",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "jupyterlab>=4.2",
  "jsonschema[format]>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "maturin>=1.9", "pyinstaller>=6.22"]

# OCR intake and print-scan round-trip measurement. RapidOCR is the default
# engine because it is pure Python, runs offline, and ships hashable ONNX models.
# Tesseract is a system binary and is therefore NOT declarable here: install it
# separately (with 'chi_tra' for Traditional Chinese) to enable the second
# engine profile.
ocr = [
  "rapidocr-onnxruntime>=1.2",
  "onnxruntime>=1.17",
  "pillow>=10.0",
  "opencv-python>=4.9",
  "pymupdf>=1.24",
  "pdf2image>=1.17",
]

# Real-model watermarked generation against a pinned local model. Model weights
# are never downloaded by the lab: a directory without them is refused.
generation = [
  "torch>=2.13",
  "transformers>=5.0",
]

[project.scripts]
watermark-lab = "watermark_lab.cli:app"
watermark-lab-gui = "watermark_lab.gui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watermark_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: integration tests that exercise CLI, GUI, or service boundaries"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["BLE001"]
